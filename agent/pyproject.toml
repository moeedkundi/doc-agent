[project]
name = "docagent-agent"
version = "0.1.0"
description = "LangGraph ingest and ask graphs."
requires-python = ">=3.12,<3.13"
dependencies = [
    "docagent-schemas",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-postgres>=3.2.1",
    "mcp>=2.3",
    "psycopg[binary]>=3.3",
    "pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
docagent-schemas = { workspace = true }
