name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: docagent
          POSTGRES_PASSWORD: docagent
          POSTGRES_DB: docagent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U docagent -d docagent"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://docagent:docagent@127.0.0.1:5432/docagent
      REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Types
        run: uv run pyright

      - name: Tests
        run: uv run pytest -q
