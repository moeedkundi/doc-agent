[project]
name = "docagent-mcp-sqlstore"
version = "0.1.0"
description = "MCP server: read-only SQL queries and typed record saves."
requires-python = ">=3.12,<3.13"
dependencies = [
    "docagent-db",
    "docagent-mcp-common",
    "docagent-schemas",
    "mcp>=2.3",
    "psycopg[binary]>=3.3",
    "sqlglot>=30.31.0",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
docagent-schemas = { workspace = true }
docagent-mcp-common = { workspace = true }
docagent-db = { workspace = true }
