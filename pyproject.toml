[project]
name = "docagent"
version = "0.1.0"
description = "Agentic document-to-data system on MCP (portfolio demo)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "docagent-schemas",
    "docagent-gateway",
    "docagent-mcp-extraction",
    "docagent-mcp-validation",
    "docagent-mcp-sqlstore",
    "docagent-mcp-reference",
    "docagent-agent",
    "docagent-api",
]

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "ruff>=0.12",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "servers/*", "agent", "api"]

[tool.uv.sources]
docagent-schemas = { workspace = true }
docagent-gateway = { workspace = true }
docagent-mcp-extraction = { workspace = true }
docagent-mcp-validation = { workspace = true }
docagent-mcp-sqlstore = { workspace = true }
docagent-mcp-reference = { workspace = true }
docagent-agent = { workspace = true }
docagent-api = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["web", "evals/dataset"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["packages", "servers", "agent", "api"]
exclude = ["**/.venv", "web", "evals/dataset", "**/__pycache__"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "-ra"]
testpaths = ["packages", "servers", "agent", "api"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
