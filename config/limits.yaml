# Operational limits. Secrets and budgets in USD come from env vars
# (DAILY_BUDGET_USD, SESSION_BUDGET_USD); everything else is configured here.

uploads:
  allowed_types: [application/pdf, image/png, image/jpeg]
  max_bytes: 5242880        # 5 MB
  max_pages: 5

rate_limits:                # per hashed client IP
  runs: "5/10minutes"
  questions: "20/10minutes"

sessions:
  ttl_hours: 24

extraction:
  render_dpi: 150
  max_reextract_attempts: 2

validation:
  review_confidence_threshold: 0.80
  amount_tolerance: 0.01    # arithmetic checks (currency units)

po_matching:
  unit_price_tolerance_pct: 2.0
  description_match_min_score: 85   # rapidfuzz score 0..100

sql:
  max_rows: 200
  statement_timeout_ms: 3000

llm:
  request_timeout_s: 90       # per provider call
  max_retries: 3              # extra attempts on 429/5xx/timeouts, per tier
  backoff_base_s: 1.0         # exponential: base * 2^attempt, with jitter
  backoff_max_s: 20.0
  max_output_tokens: 16384    # hard cap per call (bounds worst-case cost)
  call_reserve_usd: 0.05      # a call is refused unless this much budget is still left
