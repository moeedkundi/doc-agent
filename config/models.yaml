# Model tiers used by packages/gateway. This is the ONLY place model IDs live.
#
# Prices are USD per 1M tokens, paid tier, prompts <= 200k tokens (ours are far smaller).
# Output price applies to thinking tokens too (LiteLLM folds them into completion_tokens).
# A tier may list several price periods; the first whose `until` (inclusive, UTC date) has
# not passed applies, and a period without `until` is open-ended.
#
# Source: https://aistudio.google.com/docs/models and https://aistudio.google.com/docs/pricing
# (formerly ai.google.dev/gemini-api/docs/...), checked 2026-11-14.

tiers:
  default:
    # Stable Flash-class model. gemini-3.8-flash (same price) returned 503 "high demand" on
    # every call for ~15 min on 2026-11-14 while this one answered; switch back by editing
    # this line once it is reliable.
    model: gemini-3.6-flash
    provider: gemini
    api_key_env: GEMINI_API_KEY
    reasoning_effort: low       # keep thinking tokens (billed as output) small
    prices:
      - { until: 2026-12-31, input_per_mtok: 0.75, output_per_mtok: 3.75 }   # introductory
      - { input_per_mtok: 1.50, output_per_mtok: 7.50 }

  strong:
    # TEMPORARY (2026-11-14): the demo key is free-tier and gemini-4-argon's free-tier quota
    # is 0, so escalation could not run. gemini-4-hydrogen (Gemini 4, free quota available)
    # stands in until billing is enabled. To restore, use:
    #   model: gemini-4-argon
    #   prices: [{until: 2026-11-30, in 2.00, out 10.00}, {in 4.00, out 20.00}]
    model: gemini-4-hydrogen
    provider: gemini
    api_key_env: GEMINI_API_KEY
    reasoning_effort: medium
    prices:
      - { input_per_mtok: 1.50, output_per_mtok: 7.50 }

# If a tier keeps failing with transient provider errors after retries, try the next tier.
fallback_order: [default, strong]
